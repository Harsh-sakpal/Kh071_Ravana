version: '3.8'

services:
  civicflow-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicflow-ai-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PYTHONPATH=/app:/app/civicflow-ai-person2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
