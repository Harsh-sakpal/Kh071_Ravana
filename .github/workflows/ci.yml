name: CivicFlow AI — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Lint Check
  # ─────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linting tools
        run: pip install ruff
      - name: Run ruff lint
        run: ruff check ai/ pipeline/ civicflow-ai-person2/app/ --ignore E501

  # ─────────────────────────────────────────────────────────
  # Job 2: Person 1 Unit Tests
  # ─────────────────────────────────────────────────────────
  unit-tests-person1:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest scikit-learn numpy
          pip install -r civicflow-ai-person2/requirements.txt
      - name: Run Person 1 unit tests
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/test_ai_foundation.py tests/test_tfidf_baseline.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ─────────────────────────────────────────────────────────
  # Job 3: Pipeline Integration Tests
  # ─────────────────────────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest pydantic
          pip install -r civicflow-ai-person2/requirements.txt
      - name: Run pipeline integration tests
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/test_pipeline_integration.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/civicflow-ai-person2

  # ─────────────────────────────────────────────────────────
  # Job 4: Recursive Learning Tests
  # ─────────────────────────────────────────────────────────
  learning-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest pydantic
      - name: Run recursive learning tests
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/test_recursive_learning.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ─────────────────────────────────────────────────────────
  # Job 5: Self-Repair & Taxonomy Sync Validation
  # ─────────────────────────────────────────────────────────
  self-repair-tests:
    runs-on: ubuntu-latest
    needs: [integration-tests, learning-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest pydantic scikit-learn numpy
          pip install -r civicflow-ai-person2/requirements.txt
      - name: Run self-repair & taxonomy drift tests
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/test_self_repair.py -v --tb=long
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/civicflow-ai-person2

  # ─────────────────────────────────────────────────────────
  # Job 6: Full Suite Summary
  # ─────────────────────────────────────────────────────────
  full-suite:
    runs-on: ubuntu-latest
    needs: [unit-tests-person1, integration-tests, learning-tests, self-repair-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest pydantic scikit-learn numpy
          pip install -r civicflow-ai-person2/requirements.txt
      - name: Run full test suite
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/test_pipeline_integration.py tests/test_recursive_learning.py tests/test_self_repair.py -v --tb=short --junitxml=test-results.xml
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/civicflow-ai-person2
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ─────────────────────────────────────────────────────────
  # Job 7: Docker Container Build & Integration Test
  # ─────────────────────────────────────────────────────────
  docker-build-and-test:
    runs-on: ubuntu-latest
    needs: [full-suite]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        run: |
          docker build -t civicflow-ai:latest .
      - name: Run Container & Test Health Check
        run: |
          docker run -d --name civicflow-ai-app -p 8000:8000 civicflow-ai:latest
          sleep 5
          curl --fail http://localhost:8000/health
          curl --fail -X POST http://localhost:8000/api/v1/ai/pipeline \
            -H "Content-Type: application/json" \
            -d '{"complaint_text": "Live exposed sparking wire near school."}'

